name: Data review and quality checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run test:data
      - run: npm run lint
      - run: npm run build
        if: github.event_name != 'schedule'
      - name: Find previous source snapshot
        id: previous
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({owner:context.repo.owner,repo:context.repo.repo,workflow_id:'review-data.yml',status:'success',per_page:20});
            for (const run of runs.data.workflow_runs) {
              if (String(run.id) === String(context.runId)) continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({owner:context.repo.owner,repo:context.repo.repo,run_id:run.id});
              if (artifacts.data.artifacts.some(a=>a.name==='source-monitor'&&!a.expired)) { core.setOutput('run_id',String(run.id)); break; }
            }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run_id != ''
        with:
          name: source-monitor
          path: tmp/previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.previous.outputs.run_id }}
      - run: npm run review:queue
      - run: npm run review:sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'source-monitor' || 'review-queue' }}
          path: tmp/review/
          retention-days: 30
